; NorseDevTools settings
[General]
; log detail: 0 trace, 1 debug, 2 info (the default), 3 warn, 4 error, 6 off - set 0 for a bug report
uLogLevel=2
; reload a framework by itself when a file in its config folder is saved (checked once a second)
bAutoReload=1
; where NorseDevTools.log is written; empty = this folder
sLogDir=
